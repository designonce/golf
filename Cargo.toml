[workspace]
# Sub-crates live in crates/; switch to `members = ["crates/*"]` once the first exists.
members = ["crates/*"]
resolver = "3"


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Thomas Miles", "George Juliff", "Cormac Relf", "Declan McDonald", "Jeremy Webb"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/designonce/golf"
keywords = ["cad", "geometry", "kernel", "brep", "modeling"]
categories = ["graphics", "mathematics", "science"]

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  # The 3D render stack as one unit, a window, and both Linux display servers.
  "3d_bevy_render",
  "bevy_winit",
  "wayland",
  "x11",
] }
golf_assembly = { path = "crates/golf_assembly" }
golf_brep = { path = "crates/golf_brep" }
golf_color = { path = "crates/golf_color" }
golf_export_step = { path = "crates/golf_export_step" }
golf_frame = { path = "crates/golf_frame" }
golf_geom = { path = "crates/golf_geom" }
golf_heal = { path = "crates/golf_heal" }
golf_internal = { path = "crates/golf_internal", default-features = false }
golf_manifold = { path = "crates/golf_manifold" }
golf_mesh = { path = "crates/golf_mesh" }
golf_model = { path = "crates/golf_model" }
golf_nurbs = { path = "crates/golf_nurbs" }
golf_sketch = { path = "crates/golf_sketch" }
golf_step = { path = "crates/golf_step" }
golf_view = { path = "crates/golf_view" }
nalgebra = { version = "0.33.3" }
spade = { version = "2.13.1" }
thiserror = { version = "2.0.20" }

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "golf"
description = "An open source CAD kernel"
documentation = "https://docs.rs/golf"
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["assembly", "export_step", "mesh", "model"]
# Assemblies of parts placed in frames.
assembly = ["golf_internal/assembly"]
# Writing bodies and assemblies as STEP files.
export_step = ["golf_internal/export_step"]
# Triangle meshes of bodies.
mesh = ["golf_internal/mesh"]
# Sketch-and-extrude style modelling operations.
model = ["golf_internal/model"]
# A Bevy viewer for meshes. Pulls in Bevy, so off by default.
view = ["golf_internal/view"]

[dependencies]
golf_internal.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Geometry code is numeric and generic: unoptimised (nalgebra's generics are
# compiled into our crates too) meshing runs about thirty times slower, which
# makes examples and tests crawl. A light opt-level for our crates and a full
# one for dependencies keeps dev builds quick to run and still quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
